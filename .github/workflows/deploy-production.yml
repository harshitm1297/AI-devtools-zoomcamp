name: Deploy production
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable commit SHA already verified in development
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger manually approved production deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
        run: test -n "$DEPLOY_HOOK_URL" && curl --fail --retry 3 -X POST -H "Content-Type: application/json" -d "{\"image\":\"$IMAGE\"}" "$DEPLOY_HOOK_URL"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: test -n "$BASE_URL" && curl --fail --retry 12 --retry-delay 5 "$BASE_URL/healthz" && curl --fail "$BASE_URL/version"
