name: Deploy development
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
      - name: Trigger immutable development deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEV_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
        run: test -n "$DEPLOY_HOOK_URL" && curl --fail --retry 3 -X POST -H "Content-Type: application/json" -d "{\"image\":\"$IMAGE\"}" "$DEPLOY_HOOK_URL"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: test -n "$BASE_URL" && curl --fail --retry 12 --retry-delay 5 "$BASE_URL/healthz" && curl --fail "$BASE_URL/version"

