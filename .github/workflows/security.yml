name: Security
on:
  pull_request:
  push:
    branches: [main, project]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip bandit pip-audit
      - run: pip install ".[agents]"
      - name: Static application security test
        run: bandit -r backend incident-response mcp-server -x tests --severity-level medium --confidence-level medium
      - name: Dependency vulnerability audit
        run: pip-audit --local
      - name: Filesystem and secret scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
