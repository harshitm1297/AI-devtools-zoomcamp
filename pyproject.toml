[project]
name = "guardian-angel"
version = "0.1.0"
description = "An explainable multimodal spending-risk assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[project.optional-dependencies]
agents = ["mcp>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

