apiVersion: 1
groups:
  - orgId: 1
    name: Guardian Angel user impact
    folder: Guardian Angel
    interval: 30s
    rules:
      - uid: guardian-assessment-failures
        title: GuardianAngelAssessmentFailures
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'sum(increase(guardian_angel_assessments_total{outcome="error"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              conditions:
                - evaluator: {params: [3], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              refId: C
              type: threshold
        dashboardUid: guardian-angel-overview
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Spending assessments are failing
          description: More than three assessment attempts failed during the last five minutes.
          endpoint: /api/purchases/{purchase_id}/assess
        labels:
          service: guardian-angel
          environment: local-compose
          allow_fix: "false"
        isPaused: false

